spring:
  application:
    name: autolog

  datasource:
    url: jdbc:postgresql://localhost:5432/autolog_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# (Opzionale) logging
logging:
  level:
    org.springframework: INFO
    com.github.[miousername]: DEBUG
