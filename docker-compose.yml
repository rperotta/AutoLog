version: '3.9'
services:
  db:
    image: postgres:15
    container_name: autolog_db
    environment:
      POSTGRES_DB: autolog_db
      POSTGRES_USER: autolog
      POSTGRES_PASSWORD: autolog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
